<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#15132a" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Happy Birthday</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="is-intro">
  <!-- Music toggle: always visible, never autoplays on load -->
  <button id="music-toggle" class="music-toggle" type="button" aria-pressed="false" aria-label="Play music">
    <svg class="music-note" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18.5a2.5 2.5 0 1 1-2-2.45V5.5l11-2.5v11.5a2.5 2.5 0 1 1-2-2.45V7.1l-7 1.6v9.8z"/></svg>
    <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="music-label">music</span>
  </button>
  <audio id="bg-music" loop preload="none"></audio>

  <!-- Ambient layers (decorative) -->
  <canvas id="sky" class="sky" aria-hidden="true"></canvas>
  <div id="petals" class="petals" aria-hidden="true"></div>
  <div id="flyers" class="flyers" aria-hidden="true"></div>

  <!-- ============ Opening screen ============ -->
  <section id="intro" class="intro" aria-labelledby="intro-title">
    <div class="moon" aria-hidden="true"></div>
    <div class="corner-branch left" aria-hidden="true"></div>
    <div class="corner-branch right" aria-hidden="true"></div>

    <div class="intro-content">
      <h1 id="intro-title" class="script-title">
        <span class="t-line" data-text="Happy Birthday,"></span>
        <span class="t-line name" data-name></span>
      </h1>
      <p class="intro-sub" data-text-intro-sub></p>
      <button id="open-btn" class="btn-primary" type="button"><span data-text-intro-btn></span></button>
    </div>

    <div class="garden intro-garden" aria-hidden="true"></div>
  </section>

  <!-- ============ Main experience ============ -->
  <main id="main" class="main" hidden>
    <!-- Greeting -->
    <section id="greeting" class="section greeting">
      <div class="parallax-accents" aria-hidden="true"></div>
      <div class="content">
        <div class="ornament" aria-hidden="true"><span></span><svg viewBox="0 0 100 100"><use href="#daisy"/></svg><span></span></div>
        <h2 class="script-title big reveal">Happy Birthday,<br /><span data-name></span></h2>
        <div class="message-card reveal">
          <div class="corner tl" aria-hidden="true"></div>
          <div class="corner br" aria-hidden="true"></div>
          <p class="message" data-message></p>
        </div>
        <a class="scroll-cue reveal" href="#story" aria-label="Scroll to our story"><span>scroll</span><i></i></a>
      </div>
      <div class="garden greeting-garden" aria-hidden="true"></div>
    </section>

    <!-- Our Little Story -->
    <section id="story" class="section story" aria-labelledby="story-title">
      <div class="vine-edge left" aria-hidden="true"></div>
      <div class="vine-edge right" aria-hidden="true"></div>
      <div class="content">
        <h2 id="story-title" class="section-title reveal"><span data-story-title></span></h2>
        <ol class="timeline" id="timeline"></ol>
      </div>
    </section>

    <!-- Final surprise -->
    <section id="finale" class="section finale" aria-labelledby="finale-teaser">
      <div class="dusk" aria-hidden="true"></div>
      <div class="moon small" aria-hidden="true"></div>
      <div class="fairy-lights" aria-hidden="true"></div>
      <div class="content">
        <p id="finale-teaser" class="teaser reveal" data-final-teaser></p>

        <button id="bloom-btn" class="bloom-btn reveal" type="button" aria-label="Open the last message" aria-expanded="false" aria-controls="final-message">
          <span class="bloom-halo" aria-hidden="true"></span>
          <svg viewBox="0 0 200 230" aria-hidden="true">
            <path d="M100 100 C98 160 102 200 100 230" stroke="#86a07c" stroke-width="4" fill="none" stroke-linecap="round" />
            <use href="#leaf" x="0" y="-12" width="60" height="24" transform="translate(100 196) rotate(-30) scale(.9)" />
            <use href="#leaf-dark" x="0" y="-12" width="60" height="24" transform="translate(100 206) rotate(-150) scale(.8)" />
            <g class="fb-outer"></g>
            <g class="fb-inner"></g>
            <circle class="fb-core" cx="100" cy="100" r="11" fill="#f6d893" />
          </svg>
        </button>
        <p class="tap-hint reveal" data-final-hint></p>

        <div id="final-message" class="final-message" aria-live="polite"></div>
        <p class="signoff" data-final-signoff></p>
      </div>
      <div class="garden finale-garden" aria-hidden="true"></div>
    </section>
  </main>

  <noscript><p class="noscript">Please enable JavaScript to open this little surprise.</p></noscript>

  <script src="js/config.js"></script>
  <script src="js/flowers.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
